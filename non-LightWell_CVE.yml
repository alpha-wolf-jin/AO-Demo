- name: Send Health Summary Notification
  #hosts: localhost
  hosts: all
  gather_facts: false

  tasks:

    - name: Notify user via Email
      ansible.builtin.debug: 
        msg: "{{ report.description | split('\n') | list }}"

    - name: Post to Slack
      ansible.builtin.include_tasks: tasks/slack_notify.yml
      vars:
        slack_status: failed
        slack_title: "CVE Remediation Rejected"
        slack_text: "{{ report.description }}\nLink: https://myaap-ansible-automation-platform.apps.hub.lab.com/execution/jobs/playbook/{{ awx_job_id }}/output"
        slack_broadcast: false
