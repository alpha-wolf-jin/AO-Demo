---
# cve_lookup.yml - look up any CVE across public sources and emit one normalised JSON record.
#
# Usage:
#   ansible-playbook cve_lookup.yml -e cve_id=CVE-2024-23334
#   ansible-playbook cve_lookup.yml -e cve_id=CVE-2024-6387 -e write_report=false
#
# Optional environment variables:
#   GITHUB_TOKEN  raises the GitHub Advisory API limit from 60 to 5,000 requests/hour
#   NVD_API_KEY   raises the NVD API limit from 5 to 50 requests per 30 seconds
#
# Sources (all optional - the record is built from whichever ones answer):
#   CVE.org        title, description, CNA references, CPEs, state (PUBLISHED / REJECTED)
#   NVD            description fallback, vulnerable CPE matches, CVSS, CWE
#   GitHub (GHSA)  ecosystem, repository URL, summary, references   -> open-source packages
#   OSV.dev        package URLs, affected and fixed versions          -> open-source packages
#   Red Hat        RPM package URLs, product CPEs, severity           -> RHEL / OS packages
#
# Controller requirements: ansible-core only (no jmespath / extra collections).

- name: CVE detail lookup
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cve_id: ""
    output_dir: "{{ playbook_dir }}/cve_reports"
    write_report: true
    http_timeout: 30
    github_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') | default('', true) }}"
    nvd_api_key: "{{ lookup('ansible.builtin.env', 'NVD_API_KEY') | default('', true) }}"

    gh_headers: >-
      {{ {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
         | combine({'Authorization': 'Bearer ' ~ github_token} if github_token | length > 0 else {}) }}

    # GitHub advisory ecosystem names -> OSV / purl-style names
    ghsa_ecosystem_map:
      pip: PyPI
      npm: npm
      maven: Maven
      go: Go
      nuget: NuGet
      rubygems: RubyGems
      composer: Packagist
      rust: crates.io
      erlang: Hex
      pub: Pub
      swift: SwiftURL
      actions: GitHub Actions

    # Files to scan in a repository to see whether it depends on the affected package
    manifest_files_by_ecosystem:
      PyPI: [requirements.txt, pyproject.toml, setup.py, setup.cfg, Pipfile, Pipfile.lock, poetry.lock, uv.lock]
      npm: [package.json, package-lock.json, yarn.lock, pnpm-lock.yaml]
      Maven: [pom.xml, build.gradle, build.gradle.kts, gradle.lockfile]
      Go: [go.mod, go.sum]
      NuGet: ["*.csproj", packages.config, packages.lock.json, Directory.Packages.props]
      RubyGems: [Gemfile, Gemfile.lock, "*.gemspec"]
      Packagist: [composer.json, composer.lock]
      crates.io: [Cargo.toml, Cargo.lock]
      Hex: [mix.exs, mix.lock]
      Pub: [pubspec.yaml, pubspec.lock]
      SwiftURL: [Package.swift, Package.resolved]
      GitHub Actions: [".github/workflows/*.yml", ".github/workflows/*.yaml"]
      Red Hat: [Containerfile, Dockerfile, "*.spec", "*.ks"]

    cpe_part_names:
      a: application
      o: operating system
      h: hardware

  tasks:
    # ------------------------------------------------------------------ input
    - name: Normalise CVE ID
      ansible.builtin.set_fact:
        cve: "{{ cve_id | string | trim | upper }}"

    - name: Validate CVE ID format
      ansible.builtin.assert:
        that:
          - cve is match('^CVE-[0-9]{4}-[0-9]{4,}$')
        fail_msg: "Invalid or missing cve_id '{{ cve_id }}'. Example: -e cve_id=CVE-2024-23334"
        quiet: true

    # ---------------------------------------------------------------- queries
    - name: Query CVE.org (CVE Services)
      ansible.builtin.uri:
        url: "https://cveawg.mitre.org/api/cve/{{ cve }}"
        return_content: true
        timeout: "{{ http_timeout }}"
      register: cveorg_resp
      failed_when: false

    - name: Query NVD API 2.0
      ansible.builtin.uri:
        url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId={{ cve }}"
        headers: "{{ {'apiKey': nvd_api_key} if nvd_api_key | length > 0 else {} }}"
        return_content: true
        timeout: "{{ http_timeout }}"
      register: nvd_resp
      until: nvd_resp.status | default(0) in [200, 404]
      retries: 3
      delay: 10
      ignore_errors: true   # NVD rate-limits (403/503); continue with other sources

    - name: Query GitHub Advisory Database
      ansible.builtin.uri:
        url: "https://api.github.com/advisories?cve_id={{ cve }}&per_page=100"
        headers: "{{ gh_headers }}"
        return_content: true
        timeout: "{{ http_timeout }}"
      register: ghsa_resp
      failed_when: false

    - name: Query Red Hat Security Data API
      ansible.builtin.uri:
        url: "https://access.redhat.com/hydra/rest/securitydata/cve/{{ cve }}.json"
        return_content: true
        timeout: "{{ http_timeout }}"
      register: rh_resp
      failed_when: false

    # ------------------------------------------------------------- normalise
    - name: Keep only successful source payloads
      ansible.builtin.set_fact:
        src_cveorg: "{{ cveorg_resp.json if (cveorg_resp.status | default(0)) == 200 else {} }}"
        src_nvd: >-
          {{ nvd_resp.json.vulnerabilities[0].cve
             if (nvd_resp.status | default(0)) == 200 and (nvd_resp.json.totalResults | default(0) | int) > 0
             else {} }}
        src_ghsa: "{{ ghsa_resp.json if (ghsa_resp.status | default(0)) == 200 else [] }}"
        src_rh: "{{ rh_resp.json if (rh_resp.status | default(0)) == 200 else {} }}"

    - name: Split CVE.org record
      ansible.builtin.set_fact:
        src_cna: "{{ src_cveorg.containers.cna | default({}) }}"
        src_adp: "{{ src_cveorg.containers.adp | default([]) }}"
        cve_state: "{{ src_cveorg.cveMetadata.state | default('UNKNOWN') }}"

    # ------------------------------------------------- open-source packages
    - name: Query OSV for each GitHub advisory
      ansible.builtin.uri:
        url: "https://api.osv.dev/v1/vulns/{{ item.ghsa_id }}"
        return_content: true
        timeout: "{{ http_timeout }}"
      loop: "{{ src_ghsa }}"
      loop_control:
        label: "{{ item.ghsa_id }}"
      register: osv_resp
      failed_when: false

    - name: Collect OSV affected-package entries
      ansible.builtin.set_fact:
        osv_affected: >-
          {{ osv_resp.results | default([])
             | selectattr('status', 'defined') | selectattr('status', 'eq', 200)
             | map(attribute='json') | map(attribute='affected', default=[])
             | flatten(levels=1) | list }}
        pkg_purls: []
        pkg_fixed: []
        rh_purls: []
        rh_cpes: []

    - name: Build package URLs (last affected version) and fixed versions
      ansible.builtin.set_fact:
        pkg_purls: "{{ pkg_purls + [item.package.purl ~ (('@' ~ item.versions | last) if item.versions | default([]) | length > 0 else '')] }}"
        pkg_fixed: >-
          {{ pkg_fixed
             + (item.ranges | default([]) | map(attribute='events') | flatten(levels=1)
                | selectattr('fixed', 'defined') | map(attribute='fixed')
                | map('regex_replace', '^', item.package.name ~ '@') | list) }}
      loop: "{{ osv_affected }}"
      loop_control:
        label: "{{ item.package.name | default('?') }}"
      when: item.package.purl is defined

    # ---------------------------------------------------- RHEL / OS packages
    - name: Build RPM package URLs and product CPEs from Red Hat data
      ansible.builtin.set_fact:
        rh_purls: >-
          {{ rh_purls
             + (['pkg:rpm/redhat/' ~ nevr[0] ~ '@' ~ nevr[2] ~ '-' ~ nevr[3]
                 ~ (('?epoch=' ~ nevr[1]) if nevr[1] not in ['', '0'] else '')]
                if nevr | length == 4 else []) }}
        rh_cpes: "{{ rh_cpes + ([item.cpe] if item.cpe is defined else []) }}"
      vars:
        # NEVR: openssl-1:3.0.7-27.el9 -> [name, epoch, version, release]
        nevr: >-
          {{ item.package | default('')
             | regex_findall('^(.+)-(?:([0-9]+):)?([^-]+)-([^-]+)$') | first | default([]) }}
      loop: "{{ src_rh.affected_release | default([]) }}"
      loop_control:
        label: "{{ item.package | default('?') }}"

    # ------------------------------------------------------------- derive
    - name: Derive CPEs, references, CWEs and CVSS metric
      ansible.builtin.set_fact:
        all_cpes: >-
          {{ ((src_nvd.configurations | default([])
               | map(attribute='nodes', default=[]) | flatten(levels=1)
               | map(attribute='cpeMatch', default=[]) | flatten(levels=1)
               | selectattr('vulnerable', 'defined') | selectattr('vulnerable')
               | map(attribute='criteria') | list)
             + (([src_cna] + src_adp)
               | map(attribute='affected', default=[]) | flatten(levels=1)
               | map(attribute='cpes', default=[]) | flatten(levels=1) | list)
             + rh_cpes)
             | unique }}
        all_refs: >-
          {{ ((src_cna.references | default([]) | map(attribute='url') | list)
             + (src_ghsa | map(attribute='references', default=[]) | flatten(levels=1) | list)
             + (src_nvd.references | default([]) | map(attribute='url') | list))
             | unique }}
        all_cwes: >-
          {{ ((src_ghsa | map(attribute='cwes', default=[]) | flatten(levels=1)
               | map(attribute='cwe_id', default='') | list)
             + (src_nvd.weaknesses | default([]) | map(attribute='description', default=[])
               | flatten(levels=1) | map(attribute='value', default='') | list)
             + (src_cna.problemTypes | default([]) | map(attribute='descriptions', default=[])
               | flatten(levels=1) | map(attribute='cweId', default='') | list)
             + ([src_rh.cwe] if src_rh.cwe is defined else []))
             | select('match', '^CWE-[0-9]+$') | unique }}
        nvd_metric: >-
          {{ ['cvssMetricV40', 'cvssMetricV31', 'cvssMetricV30', 'cvssMetricV2']
             | select('in', src_nvd.metrics | default({}))
             | map('extract', src_nvd.metrics | default({}))
             | flatten(levels=1) | first | default({}) }}

    - name: Determine ecosystem, repository and CVSS score
      ansible.builtin.set_fact:
        eco: >-
          {{ osv_affected[0].package.ecosystem
               if osv_affected | length > 0 and osv_affected[0].package.ecosystem is defined
             else (ghsa_ecosystem_map[src_ghsa[0].vulnerabilities[0].package.ecosystem]
                     | default(src_ghsa[0].vulnerabilities[0].package.ecosystem)
                   if src_ghsa | length > 0 and src_ghsa[0].vulnerabilities | default([]) | length > 0
             else ('Red Hat'
                   if (src_rh.affected_release | default([]) + src_rh.package_state | default([])) | length > 0
             else ('CPE (' ~ (cpe_part_names[all_cpes[0].split(':')[2]] | default('unknown')) ~ ')'
                   if all_cpes | length > 0 and all_cpes[0] is match('^cpe:2[.]3:')
             else 'unknown'))) }}
        repo_url: >-
          {{ ((src_ghsa | map(attribute='source_code_location', default='') | select | list)
             + (all_refs
                | select('match', '^https://(github[.]com|gitlab[.]com|bitbucket[.]org)/[^/]+/[^/#?]+')
                | reject('match', '^https://github[.]com/advisories/')
                | map('regex_replace', '^(https://[^/]+/[^/]+/[^/#?]+).*$', '\\1')
                | map('regex_replace', '[.]git$', '')
                | list))
             | first | default('') }}
        cvss_raw: >-
          {{ [nvd_metric.cvssData.baseScore | default(''),
              src_ghsa | map(attribute='cvss', default={}) | map(attribute='score', default='') | first | default(''),
              src_rh.cvss3.cvss3_base_score | default('')]
             | map('string') | reject('in', ['', 'None', '0', '0.0']) | first | default('') }}

    # ------------------------------------------------------------- assemble
    - name: Assemble CVE record
      ansible.builtin.set_fact:
        cve_record:
          cve_id: "{{ cve }}"
          title: >-
            {{ [src_cna.title | default(''),
                src_ghsa | map(attribute='summary', default='') | first | default(''),
                src_rh.bugzilla.description | default('')]
               | select | first | default('') | trim }}
          description: >-
            {{ [src_cna.descriptions | default([]) | selectattr('lang', 'match', '^en')
                  | map(attribute='value') | first | default(''),
                src_cna.rejectedReasons | default([]) | map(attribute='value') | first | default(''),
                src_nvd.descriptions | default([]) | selectattr('lang', 'match', '^en')
                  | map(attribute='value') | first | default(''),
                src_ghsa | map(attribute='description', default='') | first | default(''),
                src_rh.details | default([]) | first | default('')]
               | select | first | default('') | trim }}
          ecosystem: "{{ eco }}"
          purls: "{{ (pkg_purls + rh_purls) | unique }}"
          cpes: "{{ all_cpes }}"
          repository_url: "{{ repo_url }}"
          references: "{{ all_refs }}"
          affected_manifest_files: "{{ manifest_files_by_ecosystem[eco] | default([]) }}"
          fixed_versions: "{{ pkg_fixed | unique }}"
          severity: >-
            {{ [nvd_metric.cvssData.baseSeverity | default(''),
                nvd_metric.baseSeverity | default(''),
                src_ghsa | map(attribute='severity', default='') | first | default(''),
                src_rh.threat_severity | default('')]
               | select | first | default('') | upper }}
          cvss_score: "{{ cvss_raw | float if cvss_raw | length > 0 else none }}"
          cwes: "{{ all_cwes }}"
          state: "{{ cve_state }}"
          published: >-
            {{ src_cveorg.cveMetadata.datePublished | default(src_nvd.published | default(''), true) }}
          sources: >-
            {{ [('cve.org' if src_cveorg else ''),
                ('nvd' if src_nvd else ''),
                ('github-advisory' if src_ghsa else ''),
                ('osv' if osv_affected else ''),
                ('red-hat' if src_rh else '')]
               | select | list }}

    - name: Fail when no source knows this CVE
      ansible.builtin.fail:
        msg: >-
          {{ cve }} was not found in CVE.org, NVD, GitHub Advisory Database or Red Hat
          (or every source was unreachable from this host).
      when: cve_record.sources | length == 0

    # --------------------------------------------------------------- output
    - name: Show CVE record
      ansible.builtin.debug:
        var: cve_record

    #- name: Publish record to downstream workflow nodes (AAP)
